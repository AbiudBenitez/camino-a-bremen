<g transform="translate(40 1830)"><rect width="1080" height="200" rx="16" fill="#ffffff" stroke="#999"/><text x="24" y="46" font-family="Helvetica, Arial" font-size="30" fill="#222" text-anchor="start">Plantilla del mapa · Camino a Bremen · 3200 × 1800 px</text><text x="24" y="92" font-family="Helvetica, Arial" font-size="21" fill="#333" text-anchor="start">Punto rojo: donde el destino toca el suelo. Caja azul punteada: tamaño del destino. Franja amarilla: ahí va el rótulo, sin detalle.</text><text x="24" y="128" font-family="Helvetica, Arial" font-size="21" fill="#333" text-anchor="start">Camino: ancho marcado en beige y centro punteado. El taller dibuja el camino encima: en el fondo dejar tierra lisa por donde pasa.</text><text x="24" y="168" font-family="Helvetica, Arial" font-size="21" fill="#a33" text-anchor="start">Esta capa NO se entrega: es solo guía. Se borra antes de exportar.</text></g>
