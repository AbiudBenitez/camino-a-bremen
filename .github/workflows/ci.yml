name: Revisión

# Corre en cada pull request y en main. La Definición de Terminado exige que las
# reglas tengan prueba automatizada: aquí es donde se comprueba.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
